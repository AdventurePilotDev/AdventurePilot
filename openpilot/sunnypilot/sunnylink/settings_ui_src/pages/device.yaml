# Page: device
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: device
label: Device
icon: device
order: 6
remote_configurable: true
description: Device behavior, units, and recording settings
sections:
- id: general
  title: General
  description: Power, boot, and unit preferences
  items:
  - key: OffroadMode
    widget: toggle
    title: Force Offroad Mode
  - key: DeviceBootMode
    widget: option
    title: Wake Up Behavior
    description: 'Controls state of the device after boot/sleep. Default: Device will boot/wake-up normally and will be ready
      to engage. Offroad: Device will be in Always Offroad mode after boot/wake-up.'
    options:
    - value: 0
      label: Standard
    - value: 1
      label: Always Offroad
  - key: QuietMode
    widget: toggle
    title: Quiet Mode
  - key: OnroadUploads
    widget: toggle
    title: Onroad Uploads
  - key: MaxTimeOffroad
    widget: option
    title: Max Time Offroad
    description: Device will automatically shutdown after set time once the engine is turned off. 30h is the default.
    options:
    - value: 0
      label: Always On
    - value: 5
      label: 5m
    - value: 10
      label: 10m
    - value: 15
      label: 15m
    - value: 30
      label: 30m
    - value: 60
      label: 1h
    - value: 120
      label: 2h
    - value: 180
      label: 3h
    - value: 300
      label: 5h
    - value: 600
      label: 10h
    - value: 1440
      label: 24h
    - value: 1800
      label: 30h (Default)
  - key: JetlinkLink
    widget: multiple_button
    title: Jetlink (Experimental)
    description: Runs the big driving model on a Jetson, Mac or Linux PC (USB), or an iPhone/iPad (iOS), plugged into
      the comma's USB-C port with a USB 3 cable. Power the comma from the car, not that port. If the link drops, the comma
      keeps driving on the small model. Not used when a chestnut is fitted. Also on the device under Models.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: USB
    - value: 2
      label: iOS
    enablement:
    - $ref: '#/macros/offroad'
- id: language
  title: Language
  items:
  - key: LanguageSetting
    widget: info
    title: Language
