name: Nightly SP Sync

# Nightly: merge sunnypilot/master into dev, re-vendoring the opendbc submodule whenever SP bumps it.
# Clean -> push dev. Any unresolved conflict -> open a PR for manual resolution.
# Runs on GitHub-hosted ubuntu (pure git, not the device). dev has no build/CI of its own; the build
# gate is at stg-src promotion, so auto-advancing dev on a clean sync is low-risk.
# Schedule fires only from the DEFAULT branch (dev). Also dispatchable manually.

on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC nightly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge sunnypilot/master (+ opendbc re-vendor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add sunnypilot https://github.com/sunnypilot/sunnypilot.git 2>/dev/null || true
          git remote add opendbc    https://github.com/sunnypilot/opendbc.git    2>/dev/null || true
          git fetch -q sunnypilot master
          git fetch -q opendbc master

          if git merge-base --is-ancestor sunnypilot/master HEAD; then
            echo "dev already contains sunnypilot/master $(git rev-parse --short sunnypilot/master); nothing to do."
            exit 0
          fi

          OLD_SP=$(git merge-base HEAD sunnypilot/master)
          OLD_ODB=$(git ls-tree "$OLD_SP" opendbc_repo | awk '{print $3}')
          NEW_ODB=$(git ls-tree sunnypilot/master opendbc_repo | awk '{print $3}')
          NEW_SP=$(git rev-parse --short sunnypilot/master)
          echo "syncing -> SP $NEW_SP ; opendbc $OLD_ODB -> $NEW_ODB"

          conflict=0
          git merge --no-commit --no-ff sunnypilot/master || true

          # recurring auto-resolves: drop SP CI workflows (dev is source-only); keep opendbc vendored
          git diff --name-only --diff-filter=U -- '.github/workflows/' | while read -r f; do git rm -f "$f" >/dev/null 2>&1 || true; done
          git rm -rf opendbc_repo~sunnypilot_master >/dev/null 2>&1 || true
          git checkout --ours -- opendbc_repo >/dev/null 2>&1 || true
          git add opendbc_repo >/dev/null 2>&1 || true

          # opendbc re-vendor (only if SP bumped its submodule) via tree-level 3-way merge
          if [ -n "$NEW_ODB" ] && [ "$OLD_ODB" != "$NEW_ODB" ]; then
            git fetch -q opendbc "$NEW_ODB" 2>/dev/null || true
            OURS=$(git commit-tree "$(git rev-parse HEAD:opendbc_repo)" -p "$OLD_ODB" -m revendor-tmp)
            if MT=$(git merge-tree --write-tree --merge-base="$OLD_ODB" "$OURS" "$NEW_ODB" 2>/dev/null); then
              MTREE=$(printf '%s' "$MT" | head -1)
              rm -rf opendbc_repo && mkdir opendbc_repo
              git archive "$MTREE" | tar -x -C opendbc_repo
              git add -A opendbc_repo
              echo "opendbc re-vendored cleanly -> $NEW_ODB"
            else
              echo "::warning::opendbc re-vendor produced conflicts"; conflict=1
            fi
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::warning::unresolved conflicts:"; git diff --name-only --diff-filter=U; conflict=1
          fi

          today=$(date -u +%Y%m%d)
          if [ "$conflict" = "0" ]; then
            git commit --no-edit -m "nightly: sync sunnypilot/master ($NEW_SP)"
            git push --no-verify origin HEAD:dev
            echo "dev advanced to SP $NEW_SP"
          else
            br="sp-sync-$today"
            git add -A
            git commit --no-edit -m "WIP nightly SP sync $NEW_SP (conflicts - manual resolution needed)" || true
            git push --no-verify -f origin HEAD:"$br"
            gh pr create --base dev --head "$br" \
              --title "Nightly SP sync ($NEW_SP) - conflicts" \
              --body "Automated sync to sunnypilot/master $NEW_SP hit conflicts. Resolve and merge into dev." \
              2>/dev/null || echo "PR for $br may already exist"
          fi
