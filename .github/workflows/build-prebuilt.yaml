name: Build Prebuilt

# On-demand-ish, branch-generic prebuilt builder for the comma 3X self-hosted runner (label: tici).
# This file lives ON each build branch (rs-dev, rs-angle, ...), NOT on master — master is kept
# intentionally CI-free. It fires on every push to its branch and publishes "<branch>-prebuilt".
#   push to rs-dev   -> builds rs-dev   -> publishes rs-dev-prebuilt
#   push to rs-angle -> builds rs-angle -> publishes rs-angle-prebuilt
# (workflow_dispatch is also kept for manual re-runs via the API / gh on the branch.)
#
# Safety carried over from the known-good build:
#   - LFS: never carry .gitattributes into the published tree (so `git add` on the LFS-enabled
#     publish runner can't re-pointerize real binaries) + a hard pointer-stub guard. (This is what
#     bricked the deleted branch.)
#   - boot: build in /data/ap-build (NOT /data/openpilot), and always() clean up the build dir +
#     re-enable powersave, so a job can't leave the device's openpilot dirty.

on:
  push:
    branches: [ rs-dev, rs-angle ]
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Branch to build (blank = the branch you run this from)"
        required: false
        default: ""
      target_repo:
        description: "owner/repo to publish <branch>-prebuilt to (blank = this repo)"
        required: false
        default: ""

env:
  SOURCE_BRANCH: ${{ github.event.inputs.source_branch || github.ref_name }}
  BUILD_DIR: "/data/ap-build"
  OUTPUT_DIR: ${{ github.workspace }}/output
  SCONS_CACHE_DIR: ${{ github.workspace }}/release/ci/scons_cache
  CACHEDB: "/data/cache/tinygrad/cache.db"
  XDG_CACHE_HOME: "/data/cache"

jobs:
  build:
    runs-on: [self-hosted, tici]
    concurrency:
      group: build-${{ github.event.inputs.source_branch || github.ref_name }}
      cancel-in-progress: false
    outputs:
      source_sha: ${{ steps.meta.outputs.sha }}
    steps:
      - name: Checkout source branch (submodules + LFS)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ref: ${{ env.SOURCE_BRANCH }}

      - name: LFS pull (guarantee real bytes, not pointers)
        run: git lfs pull

      - name: Record source commit
        id: meta
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache SCons
        uses: actions/cache@v4
        with:
          path: ${{ env.SCONS_CACHE_DIR }}
          key: scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}-${{ github.sha }}
          restore-keys: |
            scons-${{ runner.os }}-${{ runner.arch }}-${{ env.SOURCE_BRANCH }}
            scons-${{ runner.os }}-${{ runner.arch }}

      - name: Set environment variables
        run: |
          source /etc/profile
          export UV_PROJECT_ENVIRONMENT=${HOME}/venv
          export VIRTUAL_ENV=$UV_PROJECT_ENVIRONMENT
          mkdir -p /data/cache/tinygrad
          printenv >> $GITHUB_ENV

      - name: Setup build environment
        run: |
          mkdir -p "${BUILD_DIR}/"
          sudo find $BUILD_DIR/ -mindepth 1 -delete
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --disable

      - name: Build
        run: |
          export PYTHONPATH="$BUILD_DIR"
          # Copy only release-manifest files (this is why .gitattributes never enters the tree).
          ./release/release_files.py | sort | uniq | rsync -rRl --files-from=- . $BUILD_DIR/
          cd $BUILD_DIR
          sed -i '/from .board.jungle import PandaJungle, PandaJungleDFU/s/^/#/' panda/__init__.py
          echo "Building sunnypilot's modeld_v2..."
          scons -j$(nproc) cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal sunnypilot/modeld_v2
          echo "Building sunnypilot's locationd..."
          scons -j2 cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal sunnypilot/selfdrive/locationd
          echo "Building openpilot's locationd..."
          scons -j$(nproc) cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal selfdrive/locationd
          echo "Building rest of sunnypilot..."
          scons -j$(nproc) cache_dir=${{ env.SCONS_CACHE_DIR }} --minimal
          touch ${BUILD_DIR}/prebuilt

      - name: Prepare Output
        run: |
          sudo rm -rf ${OUTPUT_DIR}
          mkdir -p ${OUTPUT_DIR}
          rsync -am \
            --exclude='.sconsign.dblite' \
            --exclude='*.a' \
            --exclude='*.o' \
            --exclude='*.os' \
            --exclude='*.pyc' \
            --exclude='moc_*' \
            --exclude='__pycache__' \
            --exclude='Jenkinsfile' \
            --exclude='**/release/' \
            --exclude='**/.github/' \
            --exclude='**/selfdrive/ui/replay/' \
            --exclude='**/__pycache__/' \
            --exclude="${SCONS_CACHE_DIR}" \
            --exclude='**/.git/' \
            --exclude='**/.gitattributes' \
            --exclude='**/SConstruct' \
            --exclude='**/SConscript' \
            --exclude='**/.venv/' \
            --exclude='selfdrive/modeld/models/driving_vision.onnx' \
            --exclude='selfdrive/modeld/models/driving_policy.onnx' \
            --exclude='third_party/*x86*' \
            --exclude='third_party/*Darwin*' \
            --delete-excluded \
            --chown=comma:comma \
            ${BUILD_DIR}/ ${OUTPUT_DIR}/

      - name: Guard - fail on any LFS pointer stub
        run: |
          # Real binary = binary file; LFS pointer = tiny text file containing this URL.
          # grep -I skips binaries, so any hit is a stub that would brick the device.
          if grep -rlI "https://git-lfs.github.com/spec/v1" "${OUTPUT_DIR}" > /tmp/lfs_ptrs.txt; then
            echo "::error::LFS pointer stubs found in build output (would brick the device):"
            cat /tmp/lfs_ptrs.txt
            exit 1
          fi
          echo "OK: no LFS pointer stubs in output."

      - name: Tar files
        run: |
          tar czf prebuilt.tar.gz -C ${{ env.OUTPUT_DIR }} .
          ls -la prebuilt.tar.gz

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt
          path: prebuilt.tar.gz

      # --- boot-safety: always restore the device, even if the build failed ---
      - name: Re-enable powersave
        if: always()
        run: |
          PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py --enable

      - name: Cleanup build directory
        if: always()
        run: sudo rm -rf ${BUILD_DIR}

  publish:
    needs: [ build ]
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ github.event.inputs.source_branch || github.ref_name }}-prebuilt
      cancel-in-progress: true
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: prebuilt

      - name: Untar prebuilt
        run: |
          mkdir -p ${{ env.OUTPUT_DIR }}
          tar xzf prebuilt.tar.gz -C ${{ env.OUTPUT_DIR }}

      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Publish <branch>-prebuilt
        env:
          SRC: ${{ github.event.inputs.source_branch || github.ref_name }}
          REPO: ${{ github.event.inputs.target_repo || github.repository }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          set -e
          DEV_BRANCH="${SRC}-prebuilt"
          VERSION="$(date '+%Y.%m.%d')-${{ github.run_number }}"
          GIT_ORIGIN="https://x-access-token:${{ secrets.PREBUILT_PAT }}@github.com/${REPO}.git"
          echo "[-] publishing ${SRC} -> ${DEV_BRANCH} on ${REPO}"
          cd ${{ env.OUTPUT_DIR }}
          # LFS safety (belt + suspenders): no .gitattributes => `git add` cannot re-pointerize,
          # even though ubuntu-24.04 publish runners ship git-lfs.
          find . -name .gitattributes -delete
          # Final pre-commit guard in case anything slipped through.
          if grep -rlI "https://git-lfs.github.com/spec/v1" . > /tmp/lfs_ptrs.txt; then
            echo "::error::LFS pointer stubs present at publish time:"; cat /tmp/lfs_ptrs.txt; exit 1
          fi
          git init -q
          git remote add origin "$GIT_ORIGIN"
          git fetch -q origin "$DEV_BRANCH" \
            || (git checkout -b "$DEV_BRANCH" && git commit -q --allow-empty -m "initial prebuilt" && git push -u origin "$DEV_BRANCH")
          git add -f .
          DATETIME=$(date '+%Y-%m-%dT%H:%M:%S')
          git commit -q -a -m "prebuilt v${VERSION}
          source branch: ${SRC}
          date: ${DATETIME}
          source commit: ${SOURCE_SHA}
          "
          git branch -M "$DEV_BRANCH"
          git push -f origin "$DEV_BRANCH"
