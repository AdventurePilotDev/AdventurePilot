name: Nightly SP Sync

# Nightly: merge sunnypilot/master into dev, re-vendoring the opendbc submodule whenever SP bumps it,
# then advance dev-a (the angle trunk) to match dev.
# Clean -> push dev. Any unresolved conflict -> open a PR for manual resolution.
# Runs on GitHub-hosted ubuntu (pure git, not the device). dev has no build/CI of its own; the build
# gate is at stg-src promotion, so auto-advancing dev on a clean sync is low-risk.
# Schedule fires only from the DEFAULT branch (dev). Also dispatchable manually.

on:
  schedule:
    - cron: '17 9 * * *'   # 09:17 UTC nightly
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Merge sunnypilot/master (+ opendbc re-vendor)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          export GIT_LFS_SKIP_SMUDGE=1
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add sunnypilot https://github.com/sunnypilot/sunnypilot.git 2>/dev/null || true
          git remote add opendbc    https://github.com/sunnypilot/opendbc.git    2>/dev/null || true
          git fetch -q sunnypilot master
          git fetch -q opendbc master

          if git merge-base --is-ancestor sunnypilot/master HEAD; then
            echo "dev already contains sunnypilot/master $(git rev-parse --short sunnypilot/master); nothing to do."
            exit 0
          fi

          OLD_SP=$(git merge-base HEAD sunnypilot/master)
          OLD_ODB=$(git ls-tree "$OLD_SP" opendbc_repo | awk '{print $3}')
          NEW_ODB=$(git ls-tree sunnypilot/master opendbc_repo | awk '{print $3}')
          NEW_SP=$(git rev-parse --short sunnypilot/master)
          echo "syncing -> SP $NEW_SP ; opendbc $OLD_ODB -> $NEW_ODB"

          conflict=0
          git merge --no-commit --no-ff sunnypilot/master || true

          # recurring auto-resolves: drop SP CI workflows (dev is source-only); keep opendbc vendored
          git diff --name-only --diff-filter=U -- '.github/workflows/' | while read -r f; do git rm -f "$f" >/dev/null 2>&1 || true; done
          git rm -rf opendbc_repo~sunnypilot_master >/dev/null 2>&1 || true
          git checkout --ours -- opendbc_repo >/dev/null 2>&1 || true
          git add opendbc_repo >/dev/null 2>&1 || true

          # opendbc re-vendor (only if SP bumped its submodule) via tree-level 3-way merge
          if [ -n "$NEW_ODB" ] && [ "$OLD_ODB" != "$NEW_ODB" ]; then
            git fetch -q opendbc "$NEW_ODB" 2>/dev/null || true
            OURS=$(git commit-tree "$(git rev-parse HEAD:opendbc_repo)" -p "$OLD_ODB" -m revendor-tmp)
            if MT=$(git merge-tree --write-tree --merge-base="$OLD_ODB" "$OURS" "$NEW_ODB" 2>/dev/null); then
              MTREE=$(printf '%s' "$MT" | head -1)
              rm -rf opendbc_repo && mkdir opendbc_repo
              git archive "$MTREE" | tar -x -C opendbc_repo
              git add -A opendbc_repo
              echo "opendbc re-vendored cleanly -> $NEW_ODB"
            else
              echo "::warning::opendbc re-vendor produced conflicts"; conflict=1
            fi
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::warning::unresolved conflicts:"; git diff --name-only --diff-filter=U; conflict=1
          fi

          if [ "$conflict" = "0" ]; then
            git commit --no-edit -m "nightly: sync sunnypilot/master ($NEW_SP)"
            git push --no-verify origin HEAD:dev
            echo "dev advanced to SP $NEW_SP"
            exit 0
          fi

          # Conflicts need a human. Do NOT commit them: a committed conflict is a broken tree, and a
          # branch per night piles up in the device's branch picker (25 of them accumulated once).
          # Report and fail instead; the run's failure is the notification.
          {
            echo "### Nightly SP sync to \`$NEW_SP\` needs manual resolution"
            echo
            echo "Conflicted paths:"
            echo '```'
            git diff --name-only --diff-filter=U
            echo '```'
            echo
            echo "Resolve locally: \`git merge sunnypilot/master\` on \`dev\`, fix, push."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          git merge --abort || git reset --hard HEAD
          exit 1

      - name: Advance dev-a (angle trunk)
        # Runs even if the SP sync above failed: dev-a follows dev, not sunnypilot. When the sync is
        # stuck on a conflict for days, dev-a must still be able to catch up to wherever dev already is
        # -- otherwise the angle trunk silently drifts for exactly as long as the sync is red, which is
        # how stg-a-src ended up 263 commits behind.
        if: ${{ !cancelled() }}
        run: |
          # dev-a is dev + the Rivian angle layer -- the same paradigm as stg -> stg-a, one tier up.
          # It is not a *-src branch so it never builds a prebuilt; stg-a-src is promoted from it.
          # Advance it automatically or it rots the way stg-a-src did (263 commits behind, which is
          # what turned a routine angle propagation into a forward-port of two months of API renames).
          # Same contract as the sync above: push on a clean merge, otherwise report and fail.
          if ! git ls-remote --exit-code --heads origin dev-a >/dev/null 2>&1; then
            echo "dev-a does not exist on origin; skipping."
            exit 0
          fi

          git fetch -q origin dev dev-a
          DEV=$(git rev-parse origin/dev)
          git checkout -q -B dev-a origin/dev-a

          if git merge-base --is-ancestor "$DEV" HEAD; then
            echo "dev-a already contains dev $(git rev-parse --short "$DEV"); nothing to do."
            exit 0
          fi

          if git merge --no-edit "$DEV"; then
            git push --no-verify origin HEAD:dev-a
            echo "dev-a advanced to dev $(git rev-parse --short "$DEV")"
            exit 0
          fi

          {
            echo "### dev-a could not take dev \`$(git rev-parse --short "$DEV")\` cleanly"
            echo
            echo "Conflicted paths:"
            echo '```'
            git diff --name-only --diff-filter=U
            echo '```'
            echo
            echo "Resolve locally: \`git merge dev\` on \`dev-a\`, fix, push."
          } >> "${GITHUB_STEP_SUMMARY:-/dev/stdout}"
          git merge --abort || git reset --hard HEAD
          exit 1
